// ReadyUp Cvars
l4d_ready_cfg_name "RyokanMod Realism 1.3"

// Confogl Cvars
confogl_addcvar mp_gamemode "mutation12" // Realism Versus
confogl_addcvar z_difficulty "normal"
confogl_addcvar confogl_pills_limit 2

// RyokanMod 4v4 Cvars
confogl_addcvar z_common_limit 30
confogl_addcvar z_mega_mob_size 50
confogl_addcvar z_mob_spawn_min_size 15
confogl_addcvar z_mob_spawn_max_size 15
confogl_addcvar z_mob_spawn_min_interval_normal 3600
confogl_addcvar z_mob_spawn_max_interval_normal 3600
confogl_addcvar vs_survival_bonus 25
confogl_addcvar vs_defib_penalty 55
confogl_addcvar z_tank_health 4670 // 7005 HP

// RyokanMod Shared Cvars
exec cfgogl/ryokanmod/shared_cvars.cfg
// Config Cvars
exec cfgogl/ryokanmod/ryokanmod.cfg
